<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D 1st-Person Tactical Engine (Rust + wgpu + WASM)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f131a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 10px;
      padding: 16px;
    }
    #game-root {
      border: 2px solid #334155;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      background: #000;
    }
    .info {
      width: 960px;
      max-width: 100%;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="game-root">
    <canvas id="game-canvas" width="960" height="540" style="width: 960px; height: 540px; display: block;"></canvas>
  </div>
  <div class="info">
    <strong>Rust + wgpu + WGSL 独自2Dエンジン (WASM版 / 既存UIフレームワーク不使用):</strong>
    画面クリックでマウス視点 / W A S D 移動 / Q E or ← → 旋回 / 左クリック or Space 射撃 / 右クリック or F 精密エイム / Shift or C しゃがみ / R リロード / V 20枚アトラス表示切替
  </div>
  <script type="module">
    import init from './pkg/tactical2d_engine.js';
    init().catch((e) => console.error('WASM init error:', e));
  </script>
</body>
</html>
